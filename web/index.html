<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny-C playground</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #10151c; color: #e8edf3; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(980px, calc(100% - 2rem)); padding: 2rem 0 3rem; }
      h1 { margin: 0; font-size: 1.75rem; }
      .intro { color: #aab7c6; margin: .5rem 0 1.5rem; }
      .toolbar { display: flex; gap: .75rem; align-items: center; margin-bottom: .75rem; }
      button { border: 0; border-radius: .4rem; padding: .65rem 1rem; font: inherit; font-weight: 700; cursor: pointer; background: #45c486; color: #08140e; }
      button.secondary { background: #273444; color: #dce6f1; }
      label { margin-left: auto; color: #aab7c6; font-size: .9rem; }
      input { width: 7rem; margin-left: .4rem; padding: .35rem; border: 1px solid #45576c; border-radius: .3rem; background: #17212d; color: inherit; }
      textarea, pre { box-sizing: border-box; width: 100%; border: 1px solid #34465a; border-radius: .5rem; background: #0b1016; color: #e8edf3; font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
      textarea { min-height: 23rem; resize: vertical; padding: 1rem; }
      h2 { font-size: 1rem; margin: 1.25rem 0 .5rem; color: #c4d1de; }
      pre { min-height: 7rem; margin: 0; padding: 1rem; white-space: pre-wrap; }
      #status { color: #9db0c3; font-size: .9rem; }
      #status.error { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tiny-C playground</h1>
      <p class="intro">Run browser-safe Tiny-C programs through the Fable-compiled interpreter.</p>
      <div class="toolbar">
        <button id="run" type="button">Run program</button>
        <button id="example" class="secondary" type="button">Load example</button>
        <span id="status" aria-live="polite">Ready</span>
        <label>Step limit <input id="step-limit" type="number" min="1" value="10000000" /></label>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Tiny-C source"></textarea>
      <h2>Output</h2>
      <pre id="output" aria-live="polite"></pre>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
